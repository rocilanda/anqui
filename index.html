<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="安気">
<meta name="theme-color" content="#171d17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>安気</title>
<style>
  :root {
    color-scheme: dark;
    /* Paleta Empujón */
    --negro-900: #171d17; --gris-800: #252924; --gris-500: #6b796b; --gris-300: #d1d6d1;
    --gris-200: #e4e7e4; --blanco-100: #f4f5f5;
    --naranja: #f79045; --verde: #53f745; --amarillo: #fdf52a; --celeste: #45acf7; --magenta: #ea45f7;
    --error: #f74553;

    /* Tokens (el sistema es siempre oscuro) */
    --bg: var(--negro-900);            /* cuerpo */
    --surface: var(--gris-800);        /* superficie */
    --reading-bg: var(--blanco-100);   /* lectura: fondo */
    --reading-text: var(--negro-900);  /* lectura: texto */
    --text: var(--blanco-100);         /* texto primario */
    --muted: var(--gris-200);          /* texto secundario */
    --disabled: var(--gris-500);       /* texto deshabilitado */
    --line: var(--gris-500);
    --accent: var(--naranja);          /* color dominante */
    --on-color: var(--negro-900);      /* texto sobre color sólido: siempre negro */
    --new: var(--celeste); --learn: var(--magenta); --review: var(--verde);
    --gradient: linear-gradient(90deg, var(--naranja), var(--magenta), var(--celeste), var(--verde), var(--amarillo));
    --radius: 14px;
    /* Inclusive Sans cubre el alfabeto latino; lo que no tiene (kana, kanji) cae en Noto Sans JP. */
    --font: "Inclusive Sans", "Noto Sans JP", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 var(--font);
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    accent-color: var(--accent);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; height: 52px; padding: 0 8px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #back { display: inline-flex; align-items: center; gap: 6px; color: var(--amarillo); }
  #back[hidden] { display: none; }
  #back svg { width: 20px; height: 20px; }
  /* Home: sin barra superior, solo el botón de ajustes */
  body.is-home header { display: none; }
  /* Pantalla de estudio: línea divisora con el degradado de la marca */
  body.is-study header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gradient); }
  .gear {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); z-index: 5;
    width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--surface); color: var(--blanco-100); display: flex; align-items: center; justify-content: center;
  }
  .gear svg { width: 24px; height: 24px; }
  .home {
    min-height: calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; gap: 24px; padding: 56px 0 8px;
    font-family: "Noto Sans JP", var(--font);
  }
  .big-stat { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .big-stat b { font-size: 88px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
  .big-stat span { font-size: 20px; font-weight: 700; }
  .start {
    min-width: 164px; padding: 24px 40px; border-radius: 999px; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--on-color); font-size: 21px; font-weight: 700;
  }
  .home .empty { padding: 0 16px; font-family: var(--font); }
  .btn.voice { justify-content: flex-start; gap: 14px; padding: 16px 20px; border-radius: 22px; font-size: 19px; }
  .btn.voice svg { width: 30px; height: 30px; }
  header .right { justify-self: end; display: flex; gap: 4px; }
  .icon { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 8px; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
  .icon.big { font-size: 24px; line-height: 1; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 24px 4px 8px; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .list li + li { border-top: 2px solid var(--bg); }
  .list a, .list .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: inherit; text-decoration: none; }
  .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n { color: var(--new); } .l { color: var(--learn); } .r { color: var(--review); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1.5px solid var(--surface); border-radius: 12px; padding: 13px 18px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--text); text-decoration: none;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-color); }
  .btn.danger { background: transparent; border-color: var(--line); color: var(--text); }
  .btn.block { width: 100%; }
  .btn:disabled { color: var(--disabled); cursor: default; }
  .stack { display: grid; gap: 10px; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--surface);
    border-radius: 12px; padding: 12px 14px; width: 100%;
  }
  input::placeholder, textarea::placeholder { color: var(--disabled); }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 0 4px 6px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text); margin: 4px; }
  .check input { width: 20px; height: 20px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty p { margin: 0 0 16px; }
  /* Elemento destacado: fondo gradiente + borde gradiente */
  .featured {
    border: 2px solid transparent; border-radius: var(--radius);
    background:
      radial-gradient(120% 120% at 0% 0%, rgb(234 69 247 / .07), transparent 55%) padding-box,
      radial-gradient(120% 120% at 100% 0%, rgb(253 245 42 / .08), transparent 55%) padding-box,
      radial-gradient(120% 120% at 0% 100%, rgb(247 144 69 / .08), transparent 55%) padding-box,
      radial-gradient(120% 120% at 100% 100%, rgb(69 172 247 / .07), transparent 55%) padding-box,
      linear-gradient(var(--gris-800), var(--gris-800)) padding-box,
      var(--gradient) border-box;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 16px; padding: 6px 0; }
  .stat { padding: 10px 8px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat b.zero { color: var(--disabled); }
  .hint { font-size: 14px; color: var(--muted); margin: 8px 4px; }
  /* Estudio */
  .study { display: flex; flex-direction: column; min-height: calc(100dvh - 52px - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .counter { display: flex; justify-content: center; gap: 18px; font-variant-numeric: tabular-nums; font-weight: 600; margin-bottom: 12px; }
  .counter span.cur { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .card {
    flex: 1; background: var(--reading-bg); color: var(--reading-text); border-radius: 18px; padding: 28px 20px; font-size: 24px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; gap: 18px; overflow-wrap: anywhere; cursor: pointer;
  }
  .card .front { font-size: 36px; line-height: 1.3; font-weight: 500; }
  .card hr { border: 0; border-top: 1.5px solid var(--gris-300); margin: 0; }
  .card .reading { font-size: 22px; color: var(--gris-500); margin-bottom: -6px; }
  .card .back { font-size: 18px; line-height: 1.5; }
  .tools { display: flex; justify-content: center; gap: 10px; margin: -4px 0; }
  .tool {
    width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1.5px solid var(--gris-300); border-radius: 999px; color: var(--reading-text); cursor: pointer;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool.on { border-color: var(--reading-text); }
  .card textarea {
    background: #fff; color: var(--reading-text); border-color: var(--gris-300); font-size: 18px; line-height: 1.5; text-align: center;
  }
  .card textarea:focus { border-color: var(--accent); }
  .edit-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .edit-actions .btn { padding: 10px; font-size: 16px; }
  .edit-actions .btn:not(.primary) { background: none; border-color: var(--gris-300); color: var(--reading-text); }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 12px; }
  .answers button {
    border: 0; border-radius: 22px; padding: 16px 4px; cursor: pointer;
    background: #3b453c; color: var(--text); font: 700 19px/1.3 "Noto Sans JP", var(--font);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .answers small { font-size: 15px; font-weight: 700; }
  #editBack { color: var(--amarillo); font-size: 18px; }
  .show { margin-top: 14px; }
  /* Fin de la sesión: pantalla completa, sin barra superior */
  body.is-done header { display: none; }
  .done {
    min-height: calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: "Noto Sans JP", var(--font); color: var(--muted);
  }
  .done img { width: min(296px, 80vw); height: auto; }
  .done h3 { margin: 28px 0 0; font-size: 34px; font-weight: 700; letter-spacing: .04em; }
  .done p { margin: 18px 0 0; font-size: 20px; font-weight: 600; }
  .done .home-btn {
    margin-top: 64px; min-width: 209px; padding: 22px 40px; border: 3px solid var(--naranja); border-radius: 999px;
    background: var(--surface); color: var(--naranja); font-size: 22px; font-weight: 700; text-decoration: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--surface); color: var(--text); border: 1.5px solid var(--gris-200);
    padding: 10px 16px; border-radius: 999px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px);
  }
  #toast.error { color: var(--error); border-color: var(--error); }
  #toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header>
  <div><button class="icon" id="back" hidden lang="ja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="M11 5l-7 7 7 7"/></svg>戻る</button></div>
  <h1 id="title">安気</h1>
  <div class="right" id="actions"></div>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>

<script>
'use strict';
// ───────────── Datos ─────────────
const APP_NAME = '安気'; // anki: tranquilidad
const KEY = 'repaso-v1'; // no cambiar: es donde están guardadas las tarjetas
const MIN = 60e3, DAY = 864e5;
// Respuestas: 1 = Otra vez, 2 = Difícil, 4 = Fácil (no hay "Bien").
const AGAIN_MIN = 10;             // Otra vez: vuelve a aparecer en 10 minutos
const HARD_DAYS = 1;              // Difícil en una tarjeta nueva: 1 día
const EASY_DAYS = 4;              // Fácil en una tarjeta nueva: 4 días
const LEARN_AHEAD = 20 * MIN;     // se pueden mostrar tarjetas en aprendizaje hasta 20 min antes

let firstRun = false;
let db = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.cards)) return migrate(d); } catch {}
  firstRun = true;
  return { cards: [], log: {}, settings: { newPerDay: 20 } };
}
// Las versiones anteriores tenían varios mazos: se juntan todas las tarjetas en el mazo único.
function migrate(d) {
  d.settings ??= { newPerDay: 20 };
  d.log ??= {};
  if (d.decks) {
    const own = d.decks.map(x => x.newPerDay).find(v => v != null);
    if (own != null) d.settings.newPerDay = own;
    delete d.decks;
  }
  // El registro diario era { día: { mazo: nuevas } }; ahora es { día: nuevas }.
  for (const k in d.log) if (typeof d.log[k] === 'object') d.log[k] = Object.values(d.log[k]).reduce((a, b) => a + b, 0);
  d.cards.forEach(c => delete c.deckId);
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('No se pudo guardar: almacenamiento lleno', true); }
}
navigator.storage?.persist?.();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const endOfToday = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return +d; };
const newLimit = () => db.settings.newPerDay;
const introducedToday = () => db.log[dayKey()] ?? 0;

function newCard(front, back, reading = '') {
  return { id: uid(), front, reading, back, created: Date.now(), state: 'new', step: 0, due: 0, interval: 0, ease: 2.5, reps: 0, lapses: 0 };
}

// Vocabulario inicial (favoritos.json: [{f: frente, r: lectura, b: significado}])
async function addFavoritos() {
  const words = await (await fetch('favoritos.json')).json();
  const t = Date.now();
  words.forEach((w, i) => db.cards.push({ ...newCard(w.f, w.b, w.r), created: t + i }));
  save();
}

// ───────────── Programación (SM-2, estilo Anki) ─────────────
function schedule(card, grade, now = Date.now(), fuzz = true) {
  const c = { ...card };
  c.reps++;
  const graduate = days => { c.state = 'review'; c.step = 0; c.interval = days; c.due = now + days * DAY; };

  if (c.state === 'new' || c.state === 'learning') {
    c.state = 'learning';
    if (grade === 1) { c.step = 0; c.due = now + AGAIN_MIN * MIN; }
    else graduate(grade === 4 ? EASY_DAYS : HARD_DAYS);
  } else if (c.state === 'relearning') {
    if (grade === 1) c.due = now + AGAIN_MIN * MIN;
    else graduate(Math.max(1, c.interval) + (grade === 4 ? 1 : 0));
  } else { // review
    const late = Math.max(0, (now - c.due) / DAY);
    const ivl = Math.max(1, c.interval);
    let next;
    if (grade === 1) {
      c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2);
      c.interval = Math.max(1, Math.round(ivl * 0.2));
      c.state = 'relearning'; c.due = now + AGAIN_MIN * MIN;
      return c;
    }
    // Sin "Bien", Difícil es la respuesta de "me acordé": el intervalo crece normalmente (× facilidad).
    if (grade === 2) { next = (ivl + late / 2) * c.ease; }
    if (grade === 4) { next = (ivl + late) * c.ease * 1.3; c.ease += 0.15; }
    next = Math.max(ivl + 1, next);
    if (fuzz && next >= 3) next *= 0.95 + Math.random() * 0.1;
    c.interval = Math.min(36500, Math.round(next));
    c.due = now + c.interval * DAY;
  }
  return c;
}

function fmtSpan(ms) {
  const m = ms / MIN;
  if (m < 60) return `${Math.max(1, Math.round(m))} min`;
  if (m < 1440) return `${Math.round(m / 60)} h`;
  const d = ms / DAY;
  if (d < 30) return `${Math.round(d)} d`;
  if (d < 365) return `${+(d / 30).toFixed(1)} mes`;
  return `${+(d / 365).toFixed(1)} a`;
}

// ───────────── Colas ─────────────
function counts() {
  const now = Date.now(), eod = endOfToday();
  let n = 0, l = 0, r = 0;
  for (const c of db.cards) {
    if (c.state === 'new') n++;
    else if (c.state === 'learning' || c.state === 'relearning') { if (c.due <= now + LEARN_AHEAD) l++; }
    else if (c.due <= eod) r++;
  }
  n = Math.min(n, Math.max(0, newLimit() - introducedToday()));
  return { n, l, r };
}

function nextCard() {
  const now = Date.now(), eod = endOfToday();
  const cards = db.cards;
  const byDue = (a, b) => a.due - b.due;
  const learning = cards.filter(c => c.state === 'learning' || c.state === 'relearning').sort(byDue);
  if (learning[0] && learning[0].due <= now) return learning[0];
  const reviews = cards.filter(c => c.state === 'review' && c.due <= eod).sort(byDue);
  if (reviews[0]) return reviews[0];
  if (introducedToday() < newLimit()) {
    const fresh = cards.filter(c => c.state === 'new').sort((a, b) => a.created - b.created);
    if (fresh[0]) return fresh[0];
  }
  if (learning[0] && learning[0].due <= now + LEARN_AHEAD) return learning[0];
  return null;
}

// ───────────── UI helpers ─────────────
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const rich = s => esc(s).replace(/\n/g, '<br>');
const go = h => { location.hash = h; };

let toastTimer;
function toast(msg, error = false) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('error', error); t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

let backTarget = null;
function header(title, back, actions = '') {
  $('#title').textContent = title;
  backTarget = back;
  $('#back').hidden = !back;
  $('#actions').innerHTML = actions;
  document.title = title === APP_NAME ? APP_NAME : `${title} · ${APP_NAME}`;
}
$('#back').onclick = () => go(backTarget);

let timer = null, keyHandler = null, answerShown = false;
// ───────────── Voz (Web Speech API, voz japonesa del sistema) ─────────────
const canSpeak = 'speechSynthesis' in window;
const JA = /[぀-ヿ㐀-鿿]/;
let jaVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  // Preferimos voces mejoradas y las voces naturales de Apple; evitamos las de novedad (Eddy, Grandma…).
  const prefs = [/premium/i, /enhanced|mejorada/i, /kyoko/i, /o-?ren/i, /otoya/i, /hattori/i];
  jaVoice = prefs.map(p => voices.find(v => p.test(v.name))).find(Boolean)
    || voices.find(v => v.default) || voices[0] || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }

// Lee la lectura en kana (más fiable que el kanji); si no hay, el primer texto en japonés de la tarjeta.
function speechText(card) {
  for (const s of [card.reading, card.front, card.back]) {
    if (s && JA.test(s)) return s.split(/[、,\n]/).map(x => x.trim()).find(x => JA.test(x)).replace(/\./g, '');
  }
  return null;
}
// iOS: tratar el sonido de la app como reproducción de medios, para que no lo corte el modo silencio (Safari 16.4+).
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}

let utterance = null; // referencia viva: algunos navegadores descartan la frase antes de terminarla
function speak(text, btn) {
  if (!canSpeak || !text) return;
  // Safari a veces descarta una frase si se cancela justo antes: cancelamos solo si algo está sonando.
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  speechSynthesis.resume(); // por si quedó en pausa al volver a la app
  if (!jaVoice) pickVoice();
  const u = utterance = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9;
  if (jaVoice) u.voice = jaVoice;
  if (btn) { btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}
const autoSpeak = () => db.settings.autoSpeak !== false;
const SPEAKER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const GEAR = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 2h4v3.1l1.6.7 2.2-2.2 2.8 2.8-2.2 2.2.7 1.6H22v4h-3.1l-.7 1.6 2.2 2.2-2.8 2.8-2.2-2.2-1.6.7V22h-4v-3.1l-1.6-.7-2.2 2.2-2.8-2.8 2.2-2.2-.7-1.6H2v-4h3.1l.7-1.6-2.2-2.2 2.8-2.8 2.2 2.2 1.6-.7zm2 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>`;

function route() {
  clearTimeout(timer); keyHandler = null; answerShown = false;
  if (canSpeak && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  const [, name, id] = location.hash.split('/');
  window.scrollTo(0, 0);
  document.body.classList.remove('is-home', 'is-study', 'is-done');
  switch (name) {
    case 'study': return viewStudy();
    case 'add': return viewEdit(null);
    case 'edit': return db.cards.find(c => c.id === id) ? viewEdit(id) : go('#/');
    case 'cards': return viewCards();
    case 'import': return viewImport();
    case 'settings': return viewSettings();
    default: return viewHome();
  }
}
addEventListener('hashchange', route);
addEventListener('keydown', e => { if (keyHandler && !/INPUT|TEXTAREA/.test(e.target.tagName)) keyHandler(e); });
// Al volver a la app se refrescan los contadores, salvo que estés escribiendo o mirando una respuesta.
addEventListener('visibilitychange', () => { if (!document.hidden && !answerShown && !/^#\/(add|edit|import)/.test(location.hash)) route(); });

// ───────────── Vistas ─────────────
function viewHome() {
  const k = counts(), total = db.cards.length;
  header(APP_NAME, null);
  document.body.classList.add('is-home');
  // 新規 = nuevas · 習得中 = aprendiendo · 復習 = para repasar · 学習開始 = empezar a estudiar
  view.innerHTML = `
    <button class="gear" id="gear" aria-label="設定 (Ajustes)">${GEAR}</button>
    <div class="home" lang="ja">
      <div class="big-stat n"><b>${k.n}</b><span>新規</span></div>
      <div class="big-stat l"><b>${k.l}</b><span>習得中</span></div>
      <div class="big-stat r"><b>${k.r}</b><span>復習</span></div>
      ${total ? '' : `
        <div class="empty" lang="es">
          <p>Todavía no hay tarjetas.<br>Agregá las tuyas o cargá tu vocabulario de favoritos.</p>
          <button class="btn" id="fav">Cargar Favoritos</button>
        </div>`}
      <a class="start" href="#/study">学習開始</a>
    </div>`;
  $('#gear').onclick = () => go('#/settings');
  $('#fav')?.addEventListener('click', async e => {
    e.target.disabled = true;
    try { await addFavoritos(); viewHome(); }
    catch { e.target.disabled = false; toast('No se pudo cargar Favoritos. ¿Hay conexión?', true); }
  });
}

// Intervalos de los botones de respuesta, en japonés: 10分, 1日, 4日…
function fmtSpanJa(ms) {
  const m = ms / MIN;
  if (m < 60) return `${Math.max(1, Math.round(m))}分`;
  if (m < 1440) return `${Math.round(m / 60)}時間`;
  const d = ms / DAY;
  if (d < 30) return `${Math.round(d)}日`;
  if (d < 365) return `${+(d / 30).toFixed(1)}ヶ月`;
  return `${+(d / 365).toFixed(1)}年`;
}

function viewStudy() {
  answerShown = false;
  document.body.classList.add('is-study');
  document.body.classList.remove('is-done');
  // 学習 = estudio
  header('学習', '#/');

  const card = nextCard();
  if (!card) {
    const soon = db.cards.filter(c => (c.state === 'learning' || c.state === 'relearning') && c.due <= endOfToday())
      .sort((a, b) => a.due - b.due)[0];
    document.body.classList.add('is-done');
    // 今日はここまで！ = ¡hasta acá por hoy! · 残りのカードはありません。 = no quedan tarjetas
    // ひと休み = un descanso · 次のカードは…後に出ます。 = la próxima tarjeta aparece en… · ホームに戻る = volver a la home
    view.innerHTML = `<div class="done" lang="ja">
      <img src="done.png" alt="" width="706" height="707">
      <h3>${soon ? 'ひと休み' : '今日はここまで！'}</h3>
      <p>${soon ? `次のカードは${fmtSpanJa(soon.due - LEARN_AHEAD - Date.now())}後に出ます。` : '残りのカードはありません。'}</p>
      <a class="home-btn" href="#/">ホームに戻る</a></div>`;
    if (soon) timer = setTimeout(viewStudy, Math.max(1000, soon.due - LEARN_AHEAD - Date.now()));
    return;
  }

  const k = counts();
  const cur = card.state === 'new' ? 'n' : card.state === 'review' ? 'r' : 'l';
  const now = Date.now();
  // もう一度 = otra vez · 正解 = correcto · 簡単 = fácil
  const grades = [[1, 'もう一度'], [2, '正解'], [4, '簡単']];
  const previews = grades.map(([g]) => fmtSpanJa(schedule(card, g, now, false).due - now));
  view.innerHTML = `<div class="study">
    <div class="counter">
      <span class="n ${cur === 'n' ? 'cur' : ''}">${k.n}</span>
      <span class="l ${cur === 'l' ? 'cur' : ''}">${k.l}</span>
      <span class="r ${cur === 'r' ? 'cur' : ''}">${k.r}</span>
    </div>
    <div class="card" id="card" lang="ja"><div class="front">${rich(card.front)}</div></div>
    <button class="btn primary block show" id="show" lang="ja">解答を表示</button><!-- 解答を表示 = mostrar respuesta -->
  </div>`;

  let shown = false;
  const say = speechText(card);
  const replay = () => speak(say, $('#speak'));
  const reveal = () => {
    if (shown) return; shown = answerShown = true;
    $('#card').insertAdjacentHTML('beforeend', `<hr>
      ${card.reading ? `<div class="reading">${rich(card.reading)}</div>` : ''}
      ${canSpeak && say ? `<div class="tools"><button class="tool" id="speak" aria-label="Escuchar pronunciación">${SPEAKER}</button></div>` : ''}
      <div class="back" id="backText" lang="en">${rich(card.back)}</div>`);
    $('#speak')?.addEventListener('click', e => { e.stopPropagation(); replay(); });
    // 編集 = editar: aparece arriba a la derecha solo con la respuesta a la vista.
    $('#actions').innerHTML = `<button class="icon" id="editBack" lang="ja" aria-label="編集 (Editar reverso)">編集</button>`;
    $('#editBack').onclick = editBack;
    $('#show').outerHTML = `<div class="answers" lang="ja">${grades.map(([g, t], i) =>
      `<button data-g="${g}">${t}<small>${previews[i]}</small></button>`).join('')}</div>`;
    view.querySelectorAll('[data-g]').forEach(b => b.onclick = () => answer(+b.dataset.g));
    // Se llama dentro del toque del usuario, así iOS permite el audio.
    if (autoSpeak()) replay();
  };
  // Edita el reverso ahí mismo, sin salir del estudio.
  const editBack = () => {
    if ($('#backEdit')) return;
    $('#backText').outerHTML = `<div class="stack" id="backEdit">
      <textarea id="backT" lang="en" aria-label="Reverso">${esc(card.back)}</textarea>
      <div class="edit-actions"><button class="btn" id="cancelBack">Cancelar</button><button class="btn primary" id="saveBack">Guardar</button></div>
    </div>`;
    const close = () => {
      $('#backEdit').outerHTML = `<div class="back" id="backText" lang="en">${rich(card.back)}</div>`;
    };
    $('#cancelBack').onclick = close;
    $('#saveBack').onclick = () => {
      const v = $('#backT').value.trim(); if (!v) return toast('El reverso no puede quedar vacío', true);
      card.back = v; save(); close(); toast('Guardada');
    };
    $('#backT').focus();
  };
  const answer = g => {
    if (card.state === 'new') db.log[dayKey()] = introducedToday() + 1;
    Object.assign(card, schedule(card, g));
    save(); viewStudy();
  };
  $('#show').onclick = reveal;
  $('#card').onclick = reveal;
  keyHandler = e => {
    if (!shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
    else if (shown && /^[1-3]$/.test(e.key)) answer(grades[e.key - 1][0]);
    else if (shown && e.key.toLowerCase() === 'r') replay();
  };
}

function viewEdit(cardId) {
  const card = cardId ? db.cards.find(c => c.id === cardId) : null;
  const back = card ? '#/cards' : '#/settings';
  header(card ? 'Editar tarjeta' : 'Nueva tarjeta', back);
  view.innerHTML = `<form class="stack" id="f">
    <div><label for="front">Frente</label><textarea id="front" required>${esc(card?.front ?? '')}</textarea></div>
    <div><label for="reading">Lectura (opcional)</label><input id="reading" autocomplete="off" lang="ja" value="${esc(card?.reading ?? '')}"></div>
    <div><label for="backT">Reverso</label><textarea id="backT" required>${esc(card?.back ?? '')}</textarea></div>
    ${card ? '' : `<label class="check"><input type="checkbox" id="rev"> Crear también la tarjeta inversa</label>`}
    <button class="btn primary block">${card ? 'Guardar cambios' : 'Agregar'}</button>
    ${card ? `<button type="button" class="btn danger block" id="del">Eliminar tarjeta</button>
      <p class="hint">${card.state === 'new' ? 'Nueva, sin estudiar.' : `Intervalo: ${card.interval} d · Facilidad: ${Math.round(card.ease * 100)}% · Olvidos: ${card.lapses}`}</p>` : ''}
  </form>`;
  if (!card) $('#front').focus();
  $('#f').onsubmit = e => {
    e.preventDefault();
    const front = $('#front').value.trim(), backT = $('#backT').value.trim(), reading = $('#reading').value.trim();
    if (!front || !backT) return;
    if (card) { Object.assign(card, { front, back: backT, reading }); save(); toast('Guardada'); go(back); return; }
    db.cards.push(newCard(front, backT, reading));
    // La inversa muestra el significado y pregunta la palabra; la lectura va en el reverso.
    if ($('#rev').checked) db.cards.push({ ...newCard(backT, front, reading), created: Date.now() + 1 });
    save(); toast($('#rev').checked ? '2 tarjetas agregadas' : 'Tarjeta agregada');
    $('#front').value = ''; $('#reading').value = ''; $('#backT').value = ''; $('#front').focus();
  };
  $('#del')?.addEventListener('click', () => {
    if (!confirm('¿Eliminar esta tarjeta?')) return;
    db.cards = db.cards.filter(c => c.id !== cardId); save(); go(back);
  });
}

function viewCards() {
  header('Tarjetas', '#/settings', `<button class="icon big" id="add" aria-label="Agregar">＋</button>`);
  $('#add').onclick = () => go('#/add');
  view.innerHTML = `<input id="q" type="search" placeholder="Buscar…" autocomplete="off"><div id="res" style="margin-top:12px"></div>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase();
    const cards = db.cards.filter(c => !q || [c.front, c.reading ?? '', c.back].some(s => s.toLowerCase().includes(q)))
      .sort((a, b) => b.created - a.created);
    const status = c => c.state === 'new' ? '<span class="n">nueva</span>'
      : c.state === 'review' ? `<span class="r">${c.due <= Date.now() ? 'hoy' : 'en ' + fmtSpan(c.due - Date.now())}</span>`
      : '<span class="l">aprendiendo</span>';
    $('#res').innerHTML = cards.length ? `<ul class="list">${cards.slice(0, 300).map(c => `
      <li><a href="#/edit/${c.id}"><span class="name">${esc(c.front)}<div class="sub">${c.reading ? esc(c.reading) + ' · ' : ''}${esc(c.back.replace(/\n/g, '; '))}</div></span>
      <span class="sub">${status(c)}</span></a></li>`).join('')}</ul>
      ${cards.length > 300 ? `<p class="hint">Mostrando 300 de ${cards.length}. Usá la búsqueda.</p>` : ''}`
      : `<div class="empty">${q ? 'Sin resultados.' : 'Todavía no hay tarjetas.'}</div>`;
  };
  $('#q').oninput = draw; draw();
}

function viewImport() {
  header('Importar', '#/settings');
  view.innerHTML = `<div class="stack">
    <p class="hint">Pegá una tarjeta por línea, con el frente y el reverso separados por <b>tabulación</b>, <b>;</b> o <b>|</b>.
    Sirve para pegar desde una planilla (Excel / Google Sheets) o un archivo exportado de Anki como texto.
    Con tabulaciones también podés usar tres columnas: <b>palabra · lectura · significado</b>.</p>
    <textarea id="txt" style="min-height:220px" placeholder="hola;hello&#10;gracias;thank you"></textarea>
    <button class="btn primary block" id="go">Importar</button>
  </div>`;
  $('#go').onclick = () => {
    const lines = $('#txt').value.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    let added = 0;
    for (const line of lines) {
      const cols = line.split('\t').map(s => s.trim().replace(/^"(.*)"$/, '$1'));
      if (cols.length >= 3) {
        const [word, reading, meaning] = cols;
        const front = word || reading.split(/[,、]/)[0].trim();
        if (front && meaning) db.cards.push({ ...newCard(front, meaning.split(/;\s*/).join('\n'), reading), created: Date.now() + added++ });
        continue;
      }
      const sep = line.includes('\t') ? '\t' : line.includes(';') ? ';' : '|';
      const i = line.indexOf(sep); if (i < 0) continue;
      const front = line.slice(0, i).trim(), back = line.slice(i + 1).trim();
      if (front && back) db.cards.push({ ...newCard(front, back), created: Date.now() + added++ });
    }
    save();
    if (added) { toast(`${added} tarjetas importadas`); go('#/'); }
    else toast('No encontré tarjetas con separador', true);
  };
}

function viewSettings() {
  header('設定', '#/'); // 設定 = Ajustes
  view.innerHTML = `<div class="stack">
    <div><label for="np">Tarjetas nuevas por día</label>
      <input id="np" type="number" min="0" max="999" inputmode="numeric" value="${db.settings.newPerDay}"></div>
    <a class="btn block" href="#/add" style="margin-top:20px">＋ Agregar tarjeta</a>
    <h2>Tarjetas</h2>
    <ul class="list">
      <li><a href="#/cards"><span class="name">Ver tarjetas</span><span class="sub">${db.cards.length}</span><span class="sub">›</span></a></li>
      <li><a href="#/import"><span class="name">Importar desde texto</span><span class="sub">›</span></a></li>
    </ul>
    <h2>Pronunciación</h2>
    ${canSpeak ? `
      <label class="check" style="margin-top:0"><input type="checkbox" id="auto" ${autoSpeak() ? 'checked' : ''}> Leer la palabra en voz alta al mostrar la respuesta</label>
      <button class="btn block voice" id="test">${SPEAKER} Probar voz</button>
      <p class="hint">Usa la voz japonesa del iPhone. Si no se escucha, revisá el volumen y el modo silencio.
        Para una voz más natural: Ajustes del iPhone → Accesibilidad → Contenido leído → Voces → Japonés → descargá una voz "mejorada".</p>`
    : `<p class="hint" style="margin-top:0">Este navegador no permite leer en voz alta.</p>`}
    <h2>Copia de seguridad</h2>
    <p class="hint" style="margin-top:0">Tus tarjetas se guardan solo en este dispositivo. Exportá una copia de vez en cuando
      (por ejemplo a Archivos o iCloud Drive) para no perderlas si borrás la app.</p>
    <button class="btn primary block" id="exp">Exportar copia (.json)</button>
    <label class="btn block" style="margin:0;color:var(--accent);font-size:17px">Restaurar copia…
      <input type="file" id="imp" accept=".json,application/json" hidden></label>
  </div>`;
  $('#np').onchange = e => { db.settings.newPerDay = Math.max(0, parseInt(e.target.value) || 0); save(); };
  $('#auto')?.addEventListener('change', e => { db.settings.autoSpeak = e.target.checked; save(); });
  $('#test')?.addEventListener('click', () => speak('こんにちは。日本語の勉強を頑張りましょう。'));
  $('#exp').onclick = async () => {
    const name = `repaso-${dayKey()}.json`;
    const file = new File([JSON.stringify(db)], name, { type: 'application/json' });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: name });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.cards)) throw 0;
      if (!confirm(`Esto reemplaza todo por la copia (${data.cards.length} tarjetas). ¿Seguir?`)) return;
      db = migrate(data); save(); toast('Copia restaurada'); go('#/');
    } catch { toast('El archivo no es una copia válida', true); }
  };
}

if (firstRun) addFavoritos().then(route, route); else route();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
